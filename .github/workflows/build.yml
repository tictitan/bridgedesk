name: build

# Every push to master/main builds everything and publishes a release
# ("BridgeDesk 1.1.0 (build 42)"). Pushing a v* tag publishes a named release instead.
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache: false }
      - name: Test
        run: cd hub && go test ./...
      - name: Build hub (Windows, Linux, macOS)
        run: cd hub && bash build.sh
      - uses: actions/upload-artifact@v4
        with: { name: hub, path: dist/* }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Release signing key (from repo secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android/release.keystore; echo "using release key";
          else echo "::warning::ANDROID_KEYSTORE_B64 secret not set — APK signed with a throwaway key"; fi
      - name: Build APK
        env:
          BD_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BD_VERSION_CODE: ${{ github.run_number }}
        run: |
          VER=$(sed -n 's/.*appVersion *= *"\([^"]*\)".*/\1/p' hub/config.go)
          export BD_VERSION_NAME="$VER.${{ github.run_number }}"
          cd android && ANDROID_SDK=$ANDROID_HOME bash build.sh
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: android/BridgeDesk.apk }

  release:
    # Publish on every push — even if the Android build failed, the PC builds still ship.
    if: always() && github.event_name == 'push' && needs.hub.result == 'success'
    needs: [hub, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release name
        id: v
        run: |
          VER=$(sed -n 's/.*appVersion *= *"\([^"]*\)".*/\1/p' hub/config.go)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=BridgeDesk ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VER}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=BridgeDesk ${VER} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ needs.android.result }}" != "success" ]; then
            echo "note=⚠️ The Android app failed to build in this run, so BridgeDesk.apk is not attached — use the APK from the previous release." >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: ${{ steps.v.outputs.note }}
          generate_release_notes: true
          make_latest: true
